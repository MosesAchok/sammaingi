
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d14">
    <title>Your Way to Win</title>

    <style>
        :root {
            --bg: #080d14;
            --white: #f5f7fb;
            --muted: #9aa8bd;
            --green: #00d28b;
            --green-dark: #00b879;
            --orange: #f4a51c;
            --border: #243044;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: var(--bg);
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            min-height: 100vh;
            min-height: 100svh;
            padding: 10px;
            display: grid;
            place-items: stretch;
        }

        .hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;

            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;
            max-width: 900px;
            min-height: calc(100svh - 20px);

            margin: auto;
            padding: 28px 18px 22px;

            border: 1px solid var(--border);

            background:
                radial-gradient(
                    ellipse at 50% 65%,
                    rgba(0, 210, 139, 0.12),
                    transparent 40%
                ),
                linear-gradient(
                    150deg,
                    #090d14,
                    #07100f 55%,
                    #090d14
                );
        }

        /* Decorative circles */

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            z-index: -1;
            pointer-events: none;

            border: 1px solid rgba(0, 210, 139, 0.17);
            border-radius: 50%;
        }

        .hero::before {
            width: 480px;
            height: 480px;
            max-width: 100vw;
            max-height: 100vw;

            left: -48%;
            top: 35%;

            box-shadow:
                0 0 0 28px rgba(0, 210, 139, 0.10),
                0 0 0 56px rgba(0, 210, 139, 0.08);
        }

        .hero::after {
            width: 650px;
            height: 650px;
            max-width: 110vw;
            max-height: 110vw;

            right: -35%;
            bottom: -45%;

            box-shadow:
                0 0 0 28px rgba(0, 210, 139, 0.09),
                0 0 0 56px rgba(0, 210, 139, 0.07);
        }

        /* Header */

        .topline {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;

            width: 100%;

            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
        }

        .country {
            color: var(--white);
            font-size: 14px;
        }

        .slash {
            color: #536176;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
        }

        /* Small green heading */

        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            margin-top: clamp(35px, 7vh, 65px);

            color: var(--green);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            text-align: center;
            text-transform: uppercase;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: "";
            width: 28px;
            height: 2px;
            background: var(--green-dark);
        }

        /* Main headline */

        h1 {
            margin-top: 30px;

            font-size: clamp(40px, 7vw, 70px);
            font-weight: 850;
            line-height: 0.98;
            letter-spacing: -2.5px;
            text-align: center;
        }

        h1 span {
            display: block;
        }

        .green {
            color: var(--green);
        }

        .period {
            color: var(--orange);
        }

        /* REGISTER NOW button */

        .register-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            width: min(100%, 350px);
            min-height: 62px;

            margin-top: clamp(26px, 4vh, 38px);
            padding: 16px 24px;

            border-radius: 10px;

            background: var(--green);
            color: #06140f;

            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;

            box-shadow: 0 10px 35px rgba(0, 210, 139, 0.16);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .register-link:hover {
            background: #17e7a1;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 210, 139, 0.25);
        }

        .register-link:active {
            transform: scale(0.98);
        }

        .register-link:focus-visible {
            outline: 3px solid white;
            outline-offset: 4px;
        }

        .arrow {
            font-size: 28px;
            line-height: 1;
        }

        /* Footer */

        .footer {
            margin-top: 30px;
            padding-bottom: 5px;

            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }

        /* Desktop and tablets */

        @media (min-width: 700px) {
            .hero {
                min-height: calc(100svh - 20px);
            }

            .eyebrow {
                margin-top: 55px;
            }

            h1 {
                font-size: clamp(58px, 6vw, 76px);
                margin-top: 28px;
            }

            .register-link {
                margin-top: 32px;
            }
        }

        /* Small phones */

        @media (max-width: 380px) {
            .hero {
                padding: 22px 12px 18px;
            }

            .topline {
                gap: 5px;
                font-size: 9px;
                letter-spacing: 1px;
            }

            .country {
                font-size: 11px;
            }

            .eyebrow {
                gap: 8px;
                margin-top: 32px;
                font-size: 11px;
                letter-spacing: 2px;
            }

            .eyebrow::before,
            .eyebrow::after {
                width: 20px;
            }

            h1 {
                margin-top: 24px;
                font-size: clamp(36px, 11vw, 42px);
                letter-spacing: -1.8px;
            }

            .register-link {
                min-height: 58px;
                margin-top: 25px;
                padding: 14px 17px;
                font-size: 14px;
                letter-spacing: 1px;
            }

            .footer {
                margin-top: 24px;
                font-size: 9px;
                letter-spacing: 1px;
            }
        }

        /* Short screens */

        @media (max-height: 650px) {
            .hero {
                padding-top: 16px;
            }

            .eyebrow {
                margin-top: 22px;
            }

            h1 {
                margin-top: 18px;
                font-size: clamp(32px, 6.5vh, 48px);
            }

            .register-link {
                min-height: 54px;
                margin-top: 20px;
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .footer {
                margin-top: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="hero">

            <!-- HEADER -->
            <header class="topline">
                <span class="country">KENYA</span>
                <span class="slash">/</span>
                <span>NOW</span>
                <span class="dot"></span>
                <span>YOUR MOMENT IS NOW</span>
            </header>

            <!-- SUBHEADING -->
            <div class="eyebrow">
                Make your move
            </div>

            <!-- MAIN TEXT -->
            <h1>
                <span>Here is</span>
                <span>Your</span>
                <span>Way to</span>
                <span class="green">Win.</span>
                <span class="green">
                    Now<span class="period">.</span>
                </span>
            </h1>

            <!-- REGISTER BUTTON -->
            <a
                class="register-link"
                id="registerLink"
                href="https://betfalme.ke/register?ref=3189135"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>REGISTER NOW</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <!-- FOOTER -->
            <footer class="footer">
                A new moment starts here
            </footer>

        </section>

    </main>

    <script>
        // ====================================
        // PUT YOUR REGISTRATION LINK HERE
        // ====================================

        const REGISTER_URL = "https://betfalme.ke/register?ref=3189135";

        document.getElementById("registerLink").href = REGISTER_URL;

        // Example:
        // const REGISTER_URL = "https://betfalme.ke/register?ref=3189135";
    </script>

</body>
</html>
