
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d14">

    <title>Your Way to Win</title>

    <style>
        /* =========================
           1. GLOBAL STYLES
        ========================= */

        :root {
            --bg: #080d14;
            --white: #f5f7fb;
            --muted: #9aa8bd;
            --green: #00d28b;
            --green-dark: #00b879;
            --orange: #f4a51c;
            --border: #243044;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--white);
            font-family: Inter, Arial, Helvetica, sans-serif;
        }

        /* =========================
           2. PAGE LAYOUT
        ========================= */

        .page {
            min-height: 100vh;
            min-height: 100svh;
            padding: clamp(12px, 3.4vw, 30px);
            display: grid;
            place-items: stretch;
            overflow: hidden;
        }

        .hero {
            position: relative;
            isolation: isolate;

            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;
            max-width: 900px;
            min-height: calc(100svh - 60px);

            margin: 0 auto;
            padding: clamp(26px, 5vw, 54px)
                     clamp(18px, 5vw, 48px) 30px;

            border: 1px solid var(--border);

            background:
                radial-gradient(
                    ellipse at 50% 74%,
                    rgba(0, 210, 139, 0.10),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 82% 102%,
                    rgba(0, 210, 139, 0.09),
                    transparent 32%
                ),
                linear-gradient(
                    150deg,
                    #090d14 0%,
                    #07100f 55%,
                    #090d14 100%
                );

            overflow: hidden;
        }

        /* =========================
           3. DECORATIVE CIRCLES
        ========================= */

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            z-index: -1;
            pointer-events: none;

            border: 1px solid rgba(0, 210, 139, 0.17);
            border-radius: 50%;
        }

        .hero::before {
            width: min(80vw, 620px);
            height: min(80vw, 620px);

            left: -46%;
            top: 36%;

            box-shadow:
                0 0 0 29px rgba(0, 210, 139, 0.12),
                0 0 0 59px rgba(0, 210, 139, 0.10);
        }

        .hero::after {
            width: min(95vw, 780px);
            height: min(95vw, 780px);

            right: -25%;
            bottom: -46%;

            box-shadow:
                0 0 0 29px rgba(0, 210, 139, 0.11),
                0 0 0 59px rgba(0, 210, 139, 0.08);
        }

        /* =========================
           4. TOP HEADER
        ========================= */

        .topline {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;

            gap: 10px;

            color: var(--muted);
            font-size: clamp(10px, 1.6vw, 15px);
            font-weight: 750;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-align: center;
        }

        .country {
            color: var(--white);
            font-size: 1.08em;
        }

        .slash {
            color: #536176;
        }

        .dot {
            width: 9px;
            height: 9px;

            display: inline-block;
            flex-shrink: 0;

            border-radius: 50%;
            background: var(--green);
        }

        /* =========================
           5. EYEBROW TEXT
        ========================= */

        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 22px;
            margin-top: clamp(80px, 15vh, 170px);

            color: var(--green);
            font-size: clamp(12px, 2vw, 16px);
            font-weight: 800;
            letter-spacing: 0.32em;
            text-align: center;
            text-transform: uppercase;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: "";

            width: clamp(25px, 6vw, 50px);
            height: 2px;

            background: var(--green-dark);
            opacity: 0.8;
        }

        /* =========================
           6. MAIN HEADLINE
        ========================= */

        h1 {
            max-width: 760px;
            margin-top: clamp(36px, 7vh, 66px);

            font-size: clamp(52px, 10.5vw, 122px);
            font-weight: 850;
            line-height: 0.91;
            letter-spacing: -0.075em;
            text-align: center;
        }

        h1 span {
            display: block;
        }

        .green {
            color: var(--green);
        }

        .period {
            color: var(--orange);
        }

        /* =========================
           7. START BUTTON
        ========================= */

        .start-link {
            width: min(100%, 410px);
            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 26px;

            margin-top: clamp(48px, 9vh, 100px);
            padding: 20px clamp(24px, 5vw, 48px);

            border-radius: 13px;

            background: var(--green);
            color: #06140f;

            text-decoration: none;
            font-size: clamp(18px, 2.7vw, 23px);
            font-weight: 850;
            letter-spacing: 0.24em;

            box-shadow: 0 14px 50px rgba(0, 210, 139, 0.13);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .start-link:hover {
            background: #17e7a1;
            transform: translateY(-3px);

            box-shadow: 0 18px 55px rgba(0, 210, 139, 0.24);
        }

        .start-link:focus-visible {
            outline: 3px solid white;
            outline-offset: 5px;
        }

        .arrow {
            font-size: 2.1rem;
            line-height: 1;
            letter-spacing: 0;
        }

        /* =========================
           8. FOOTER
        ========================= */

        .footer {
            margin-top: auto;
            padding-top: clamp(44px, 8vh, 80px);

            color: var(--muted);

            text-align: center;
            font-size: clamp(10px, 1.7vw, 15px);
            font-weight: 750;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* =========================
           9. TABLETS AND DESKTOPS
        ========================= */

        @media (min-width: 700px) {
            .hero {
                justify-content: flex-start;
            }

            .eyebrow {
                margin-top: clamp(70px, 12vh, 130px);
            }

            h1 {
                font-size: clamp(80px, 8.2vw, 122px);
            }

            .start-link {
                margin-top: clamp(48px, 7vh, 75px);
            }
        }

        /* =========================
           10. SMALL MOBILE PHONES
        ========================= */

        @media (max-width: 380px) {
            .topline {
                gap: 7px;
                letter-spacing: 0.13em;
            }

            .eyebrow {
                gap: 10px;
                letter-spacing: 0.19em;
            }

            h1 {
                font-size: clamp(44px, 15vw, 56px);
            }

            .start-link {
                min-height: 66px;
            }

            .footer {
                letter-spacing: 0.18em;
            }
        }

        /* =========================
           11. ACCESSIBILITY
        ========================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="hero" aria-labelledby="hero-title">

            <!-- TOP HEADER -->
            <header class="topline">
                <span class="country">KENYA</span>
                <span class="slash">/</span>
                <span>NOW</span>
                <span class="dot" aria-hidden="true"></span>
                <span>YOUR MOMENT IS NOW</span>
            </header>

            <!-- SMALL GREEN TEXT -->
            <div class="eyebrow">
                Make your move
            </div>

            <!-- MAIN HEADLINE -->
            <h1 id="hero-title">
                <span>Here is</span>
                <span>Your</span>
                <span>Way to</span>
                <span class="green">Win.</span>
                <span class="green">
                    Now<span class="period">.</span>
                </span>
            </h1>

            <!-- START BUTTON -->
            <a
                class="start-link"
                id="startLink"
                href="https://betfalme.ke/register?ref=3189135"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>START</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <!-- FOOTER -->
            <footer class="footer">
                A new moment starts here
            </footer>

        </section>

    </main>

    <script>
        // ==========================================
        // CHANGE YOUR WEBSITE LINK HERE
        // ==========================================

        const START_URL = "https://betfalme.ke/register?ref=3189135";

        // Get the START button from the page
        const startLink = document.getElementById("startLink");

        // Set the destination for the button
        startLink.href = START_URL;

        // ==========================================

        //     "<span>Welcome to</span><span class='green'>My Website.</span>";
    </script>

</body>
</html>
